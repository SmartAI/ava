name: CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set release version
        if: github.event_name == 'release'
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          uv version "${GITHUB_REF_NAME#v}"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libnss3 libxkbcommon0 libgbm1 libasound2t64 fonts-noto-cjk
      - run: uv sync --frozen --extra desktop
      - run: uv run --extra desktop ruff check src tests eval
      - run: uv run --extra desktop mypy src eval/run.py eval/benchmark.py eval/diagnose.py eval/evolve.py eval/incidents.py eval/integrations/agent_config.py
      - run: uv run --extra desktop pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - run: uv run --extra desktop pyside6-qmllint --max-warnings 0 src/ava/app/desktop/qml/*.qml
      - run: npm ci
      - run: npm run check
      - run: npm test

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv version "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - run: npm run build
      - run: uv build --no-sources
      - name: Verify packaged CLI and Web UI
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/release-smoke"
          uv pip install --python "$RUNNER_TEMP/release-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          test "$(release-smoke/bin/ava --version)" = "ava ${GITHUB_REF_NAME#v}"
          release-smoke/bin/python - <<'PY'
          from importlib.resources import files

          assets = files("ava.app.web").joinpath("assets")
          assert files("ava.app.desktop").joinpath("qml/Main.qml").read_bytes()
          terminal = files("ava.app.desktop").joinpath("terminal")
          for name in ("index.html", "assets/terminal.js", "assets/terminal.css", "assets/xterm.LICENSE", "assets/addon-fit.LICENSE"):
              assert terminal.joinpath(name).read_bytes(), name
          for name in ("app.min.js", "app.min.css", "ava-logo.svg"):
              assert assets.joinpath(name).read_bytes(), name
          PY
      - name: Attach release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz
