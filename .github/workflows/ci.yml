name: CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set release version
        if: github.event_name == 'release'
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          uv version "${GITHUB_REF_NAME#v}"
      - run: uv sync --frozen
      - run: uv run ruff check src tests eval
      - run: uv run mypy src eval/run.py eval/benchmark.py eval/diagnose.py eval/evolve.py eval/incidents.py eval/integrations/agent_config.py
      - run: uv run pytest -q
      - run: npm ci
      - run: npm run check
      - run: npm test

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv version "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - run: npm run build
      - run: uv build --no-sources
      - name: Verify packaged CLI and Web UI
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/release-smoke"
          uv pip install --python "$RUNNER_TEMP/release-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          test "$(release-smoke/bin/ava --version)" = "ava ${GITHUB_REF_NAME#v}"
          release-smoke/bin/python - <<'PY'
          from importlib.resources import files

          assets = files("ava.app.web").joinpath("assets")
          for name in ("app.min.js", "app.min.css", "ava-logo.svg"):
              assert assets.joinpath(name).read_bytes(), name
          PY
      - name: Attach release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz
