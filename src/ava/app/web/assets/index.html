<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ava</title>

<style>
  /* Token layer. A subset of dsh's design-platform aliases: only the roles this
     surface actually paints, resolved to the same values so the two products
     read as one family. Light is the bare :root; dark redefines roles only. */
  :root {
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
      'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-code: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas,
      'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';

    --bg-base: rgb(255, 255, 255);
    --bg-layer-2: rgb(241, 243, 245);
    --sidebar-fill: rgb(249, 250, 251);
    --sidebar-hover: rgb(241, 243, 245);
    --sidebar-active: rgb(235, 238, 242);

    --label-primary: rgb(27, 27, 28);
    --label-secondary: rgb(97, 102, 107);
    --label-tertiary: rgb(129, 133, 140);
    --label-caption: rgb(151, 157, 166);

    --border-l1: rgba(0, 0, 0, 0.06);
    --border-l2: rgba(0, 0, 0, 0.1);
    --border-l3: rgba(0, 0, 0, 0.16);

    --bubble: rgb(237, 243, 254);
    --input-major: rgb(255, 255, 255);
    --code-block: rgb(245, 246, 247);
    --inline-code: rgb(241, 243, 245);
    --interactive-hover: rgba(0, 0, 0, 0.05);
    --overlay-mask: rgba(0, 0, 0, 0.2);
    --menu-fill: rgb(255, 255, 255);

    --accent: rgb(65, 118, 230);
    --accent-dim: rgb(103, 158, 254);
    --error: rgb(236, 19, 19);
    --success: rgb(34, 197, 94);
    --warn: rgb(245, 158, 11);

    --shadow-lv2: 0 4px 16px rgba(0, 0, 0, 0.08);
    --shadow-lv3: 0 12px 40px rgba(0, 0, 0, 0.16);

    /* One shared width axis, as in dsh's ConversationRoot: the transcript is W,
       the composer card is W + 32, so both stay centered on the same line. */
    --chat-width: 748px;
    --composer-width: calc(var(--chat-width) + 32px);
    --composer-clearance: 16px;
  }

  :root:not([data-theme='light']) {
    @media (prefers-color-scheme: dark) {
      --bg-base: rgb(21, 21, 23);
      --bg-layer-2: rgb(44, 44, 46);
      --sidebar-fill: rgb(27, 27, 28);
      --sidebar-hover: rgb(35, 35, 36);
      --sidebar-active: rgb(67, 69, 74);

      --label-primary: rgb(249, 250, 251);
      --label-secondary: rgb(207, 211, 214);
      --label-tertiary: rgb(173, 178, 184);
      --label-caption: rgb(129, 133, 140);

      --border-l1: rgba(255, 255, 255, 0.06);
      --border-l2: rgba(255, 255, 255, 0.12);
      --border-l3: rgba(255, 255, 255, 0.16);

      --bubble: rgb(44, 44, 46);
      --input-major: rgb(44, 44, 46);
      --code-block: rgb(27, 27, 28);
      --inline-code: rgb(44, 44, 46);
      --interactive-hover: rgba(255, 255, 255, 0.08);
      --overlay-mask: rgba(0, 0, 0, 0.5);
      --menu-fill: rgb(53, 54, 56);

      --accent: rgb(103, 158, 254);
      --accent-dim: rgb(86, 134, 254);
      --error: rgb(242, 90, 90);

      --shadow-lv2: 0 4px 16px rgba(0, 0, 0, 0.32);
      --shadow-lv3: 0 12px 40px rgba(0, 0, 0, 0.48);
    }
  }

  :root[data-theme='dark'] {
    --bg-base: rgb(21, 21, 23);
    --bg-layer-2: rgb(44, 44, 46);
    --sidebar-fill: rgb(27, 27, 28);
    --sidebar-hover: rgb(35, 35, 36);
    --sidebar-active: rgb(67, 69, 74);

    --label-primary: rgb(249, 250, 251);
    --label-secondary: rgb(207, 211, 214);
    --label-tertiary: rgb(173, 178, 184);
    --label-caption: rgb(129, 133, 140);

    --border-l1: rgba(255, 255, 255, 0.06);
    --border-l2: rgba(255, 255, 255, 0.12);
    --border-l3: rgba(255, 255, 255, 0.16);

    --bubble: rgb(44, 44, 46);
    --input-major: rgb(44, 44, 46);
    --code-block: rgb(27, 27, 28);
    --inline-code: rgb(44, 44, 46);
    --interactive-hover: rgba(255, 255, 255, 0.08);
    --overlay-mask: rgba(0, 0, 0, 0.5);
    --menu-fill: rgb(53, 54, 56);

    --accent: rgb(103, 158, 254);
    --accent-dim: rgb(86, 134, 254);
    --error: rgb(242, 90, 90);

    --shadow-lv2: 0 4px 16px rgba(0, 0, 0, 0.32);
    --shadow-lv3: 0 12px 40px rgba(0, 0, 0, 0.48);
  }

  * { box-sizing: border-box; }

  /* A class that sets `display` outranks the UA's `[hidden]` rule, so every
     `.iconBtn[hidden]` would still paint without this. */
  [hidden] { display: none !important; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb {
    border: 2px solid transparent;
    border-radius: 6px;
    background-clip: padding-box;
    background-color: var(--border-l3);
  }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--label-caption); }
  ::-webkit-scrollbar-track { background: transparent; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    background: var(--bg-base);
    color: var(--label-primary);
    font-family: var(--font-ui);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  #root {
    display: flex;
    width: 100%;
    height: 100%;
  }

  /* ---- Rail ------------------------------------------------------------ */

  #rail {
    display: flex;
    flex: none;
    flex-direction: column;
    width: 252px;
    background: var(--sidebar-fill);
    border-right: 1px solid var(--border-l1);
  }

  .railHead {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 52px;
    padding: 0 12px 0 16px;
  }

  .wordmark {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .mobileMenu, .railBackdrop { display: none; }

  .railList {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 8px 12px;
  }

  .railGroup {
    padding: 14px 8px 4px;
    color: var(--label-caption);
    font-size: 12px;
    font-weight: 500;
  }

  /* One row shape for every rail entry - new chat, project, chat. */
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 8px;
    border: none;
    border-radius: 8px;
    background: none;
    color: var(--label-secondary);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .row:hover { background: var(--sidebar-hover); }

  .row[data-selected] {
    background: var(--sidebar-active);
    color: var(--label-primary);
  }

  .rowName {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .newChat {
    margin-top: 4px;
    color: var(--label-primary);
    font-weight: 500;
  }

  .glyphSlot {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    color: var(--label-tertiary);
  }

  .project { color: var(--label-primary); }

  .projectChevron {
    transition: transform 120ms ease;
  }

  .project[data-open] .projectChevron { transform: rotate(90deg); }

  .chats { display: none; }
  .projectBlock[data-open] .chats { display: block; }

  .chatGroup { display: flex; align-items: center; border-radius: 8px; }

  .chatGroup:hover { background: var(--sidebar-hover); }
  .chatGroup[data-selected] { background: var(--sidebar-active); }
  .chatGroup[data-selected] .chat { color: var(--label-primary); }

  .chat {
    flex: 1; min-width: 0; width: auto;
    padding-left: 32px;
    background: none;
    font-size: 13px;
  }

  .chatGroup .chat:hover { background: none; }
  .archiveChat { opacity: 0; }

  .chatGroup:hover .archiveChat, .archiveChat:focus-visible { opacity: 1; }
  .archiveChat:hover { background: var(--interactive-hover); color: var(--label-primary); }

  .archivedToggle { padding-left: 32px; color: var(--label-caption); font-size: 12px; }

  .archivedToggle .projectChevron { margin-left: auto; }
  .archivedGroup[data-open] .projectChevron { transform: rotate(90deg); }
  .archivedList { display: none; }
  .archivedGroup[data-open] .archivedList { display: block; }

  /* Run-state dot, shared by the rail and the header. */
  .dot {
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: transparent;
  }

  .dot[data-state='running'] {
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }

  .dot[data-state='error'] { background: var(--error); }
  .dot[data-state='idle'] { background: var(--label-caption); }
  .dot[data-state='pausing'], .dot[data-state='paused'] { background: var(--warn); }
  .dot[data-state='pausing'], .dot[data-state='aborting'] { animation: pulse 1.4s ease-in-out infinite; }
  .dot[data-state='aborting'] { background: var(--error); }

  @keyframes pulse {
    50% { opacity: 0.35; }
  }

  /* ---- Column ---------------------------------------------------------- */

  main {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-width: 0;
  }

  header {
    display: flex;
    flex: none;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border-l2);
  }

  #title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    font-size: 14px;
    font-weight: 500;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .iconBtn {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    border-radius: 8px;
    background: none;
    color: var(--label-tertiary);
    cursor: pointer;
  }

  .iconBtn:hover {
    background: var(--interactive-hover);
    color: var(--label-primary);
  }

  .iconBtn.mobileMenu { display: none; }

  /* The column scrolls on one axis and holds the sticky composer, so wheeling
     over the footer still moves the transcript (dsh's scrollBody). */
  #scroll {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-gutter: stable;
  }

  #flow {
    flex: 1 0 auto;
    padding: 16px calc(var(--composer-clearance) + 16px);
  }

  #column {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: var(--chat-width);
    margin: 0 auto;
  }

  /* ---- Rows ------------------------------------------------------------ */

  .userRow {
    display: flex;
    justify-content: flex-end;
  }

  .bubble {
    max-width: min(525px, 82%);
    padding: 10px 16px;
    border-radius: 22px;
    background: var(--bubble);
    font-size: 16px;
    line-height: 24px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .assistant {
    font-size: 16px;
    line-height: 26px;
    overflow-wrap: anywhere;
  }

  .assistant p { margin: 0 0 12px; }
  .assistant p:last-child { margin-bottom: 0; }

  .assistant code {
    padding: 1px 4px;
    border-radius: 5px;
    background: var(--inline-code);
    font-family: var(--font-code);
    font-size: 0.88em;
  }

  .assistant pre {
    margin: 12px 0;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--code-block);
    overflow-x: auto;
  }

  .assistant pre code {
    padding: 0;
    border-radius: 0;
    background: none;
    font-size: 13px;
    line-height: 22px;
  }

  .assistant table {
    margin: 12px 0;
    border-collapse: collapse;
    font-size: 0.95em;
    display: block;
    max-width: 100%;
    overflow-x: auto;
  }

  .assistant th,
  .assistant td {
    padding: 5px 12px;
    border: 1px solid var(--border-l2);
    text-align: left;
  }

  .assistant th {
    background: var(--inline-code);
    font-weight: 600;
  }

  /* Tool row: dsh's DisclosureRow - 24px row, 16px leading, gap 6, 14/24 title.
     The chevron swaps in for the glyph on hover, as it does there. */
  .tool { min-width: 0; }

  .toolRow {
    display: flex;
    align-items: center;
    width: 100%;
    height: 24px;
    min-width: 0;
    padding: 0;
    border: none;
    border-radius: 6px;
    background: none;
    color: var(--label-secondary);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .toolRow:hover { background: var(--interactive-hover); }

  .leading {
    position: relative;
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    margin-right: 6px;
    color: var(--label-tertiary);
  }

  .leading svg { position: absolute; transition: opacity 100ms ease; }
  .leading .chev { opacity: 0; }
  .toolRow:hover .glyph { opacity: 0; }
  .toolRow:hover .chev { opacity: 1; }
  .tool[data-open] .chev { transform: rotate(90deg); }

  .toolName {
    flex: none;
    font-size: 14px;
    line-height: 24px;
  }

  .toolArg {
    flex: 1;
    min-width: 0;
    margin-left: 8px;
    overflow: hidden;
    color: var(--label-caption);
    font-family: var(--font-code);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .toolDuration {
    flex: none;
    margin-left: 8px;
    color: var(--label-caption);
    font-family: var(--font-code);
    font-size: 12px;
  }

  .toolDuration:empty { margin-left: 0; }

  .toolBody { display: none; }
  .tool[data-open] .toolBody { display: block; }

  /* Terminal card: dsh's TerminalBlock geometry - 12px radius, code-block
     surface, and `white-space: pre` because folding column-aligned output
     destroys its alignment. */
  .term {
    margin: 8px 0 4px 22px;
    border-radius: 12px;
    background: var(--code-block);
    overflow: hidden;
  }

  .termHead {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border-l2);
    color: var(--label-secondary);
    font-family: var(--font-code);
    font-size: 12px;
    line-height: 20px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .termOut {
    max-height: 360px;
    margin: 0;
    padding: 10px 14px;
    overflow: auto;
    color: var(--label-secondary);
    font-family: var(--font-code);
    font-size: 12px;
    line-height: 20px;
    white-space: pre;
  }

  .term[data-error] .termOut { color: var(--error); }

  /* Working line: dsh's shimmer sweep across the label. */
  .status {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    height: 26px;
    font-size: 14px;
    font-weight: 500;
    background: linear-gradient(
      90deg,
      var(--label-tertiary) 0%,
      var(--label-tertiary) 40%,
      var(--label-primary) 50%,
      var(--label-tertiary) 60%,
      var(--label-tertiary) 100%
    );
    background-size: 250% 100%;
    background-position: 100% 0;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    animation: shimmer 1.8s linear infinite;
  }

  @keyframes shimmer {
    to { background-position: 0 0; }
  }

  .clock {
    margin-left: 8px;
    color: var(--label-caption);
    -webkit-text-fill-color: var(--label-caption);
    font-size: 13px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
  }

  .errorRow {
    display: flex;
    gap: 8px;
    align-items: start;
    font-size: 13px;
    line-height: 20px;
  }

  .errorRow .dot {
    margin-top: 7px;
    background: var(--error);
  }

  .errorTitle {
    margin-right: 6px;
    color: var(--error);
    font-weight: 600;
  }

  .errorText { color: var(--label-secondary); }

  /* Empty state: the hero the composer sits under before a chat has content. */
  .empty {
    margin: 120px auto 0;
    color: var(--label-caption);
    font-size: 14px;
    text-align: center;
  }

  .emptyTitle {
    margin-bottom: 6px;
    color: var(--label-primary);
    font-size: 20px;
    font-weight: 500;
  }

  /* ---- Composer -------------------------------------------------------- */

  /* Sticky inside the scroller, with dsh's fixed 36px fade band: a growing
     draft widens the solid region instead of stretching the fade. */
  #seat {
    position: sticky;
    bottom: 0;
    z-index: 7;
    display: flex;
    flex: none;
    flex-direction: column;
    align-items: center;
    padding: 0 var(--composer-clearance) 8px;
    background: linear-gradient(
      180deg,
      color-mix(in srgb, var(--bg-base) 0%, transparent) 0px,
      var(--bg-base) 36px
    );
  }

  #card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: var(--composer-width);
    padding-top: 10px;
    border: 1px solid var(--border-l2);
    border-radius: 22px;
    background: var(--input-major);
    box-shadow: var(--shadow-lv2);
  }

  #card[data-drag] {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), var(--shadow-lv2);
  }

  .statusBar {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: var(--composer-width);
    min-height: 26px;
    padding: 5px 12px 0;
    color: var(--label-caption);
    font-family: var(--font-code);
    font-size: 11px;
  }

  .statusContext {
    display: flex;
    flex: 1;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .statusAction {
    flex: none;
    min-width: 0;
    padding: 0;
    border: none;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }

  .statusAction:hover, .statusAction:focus-visible {
    color: var(--label-secondary);
  }

  .statusAction:focus-visible {
    border-radius: 3px;
    outline: 1px solid var(--accent);
    outline-offset: 2px;
  }

  .statusSeparator { flex: none; color: var(--border-l3); }

  #cwd {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #modelChip { max-width: 45%; }
  #contextStatus { font-variant-numeric: tabular-nums; white-space: nowrap; }

  .attachments {
    display: flex; gap: 8px; min-width: 0; overflow-x: auto;
  }

  #attachmentTray { padding: 0 18px; }

  .attachmentChip {
    flex: none; max-width: 240px; padding: 4px 6px;
    color: var(--label-tertiary); cursor: default;
  }

  .attachmentChip:hover { color: var(--label-tertiary); }

  .attachmentChip img, .attachmentGlyph {
    flex: none; width: 28px; height: 28px; border-radius: 6px;
  }

  .attachmentChip img { object-fit: cover; }

  .attachmentGlyph {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--border-l1);
  }

  .attachmentCopy { min-width: 0; }

  .attachmentName {
    display: block; overflow: hidden; color: var(--label-secondary);
    text-overflow: ellipsis; white-space: nowrap;
  }

  .attachmentDetail { display: block; color: var(--label-caption); font-size: 11px; }

  .attachmentRemove { width: 22px; height: 22px; margin-left: 2px; font-size: 12px; }

  #attach:disabled { opacity: 0.4; cursor: default; }

  .bubble .attachments { flex-wrap: wrap; margin-top: 8px; overflow: visible; }
  .bubble > .attachments:first-child { margin-top: 0; }

  #draft {
    max-height: 336px;
    padding: 0 18px;
    border: none;
    background: none;
    color: var(--label-primary);
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 24px;
    resize: none;
    outline: none;
    overflow-y: auto;
  }

  #draft::placeholder { color: var(--label-caption); }
  #draft:disabled { color: var(--label-tertiary); cursor: not-allowed; }

  .archiveNotice {
    display: flex; align-items: center; gap: 12px;
    padding: 0 10px 0 18px;
    color: var(--label-secondary);
    font-size: 13px;
  }

  .archiveNotice span { flex: 1; }
  .archiveNotice .button { padding: 4px 10px; }

  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px 10px;
  }

  /* Workspace chip: the composer states which directory the turn will run in,
     because that is the one piece of context a coding agent acts on. */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 320px;
    padding: 4px 10px;
    border: none;
    border-radius: 100px;
    background: var(--interactive-hover);
    color: var(--label-tertiary);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }

  .chip:hover { color: var(--label-primary); }

  .chipName {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .hint {
    flex: 1;
    color: var(--label-caption);
    font-size: 12px;
    text-align: right;
  }

  .hint[data-running] { color: var(--label-tertiary); }

  .send {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: rgb(255, 255, 255);
    cursor: pointer;
  }

  .send:disabled {
    opacity: 0.4;
    cursor: default;
  }

  /* One button, four meanings, driven by the agent's control state: send,
     pause after the current step, abort now, resume. */
  .send .square, .send .play { display: none; }
  .send[data-mode='pause'] { background: var(--label-secondary); }
  .send[data-mode='abort'] { background: var(--error); }
  .send[data-mode='resume'] { background: var(--success); }
  .send[data-mode='pause'] .arrow, .send[data-mode='abort'] .arrow, .send[data-mode='resume'] .arrow { display: none; }
  .send[data-mode='pause'] .square, .send[data-mode='abort'] .square { display: inline; }
  .send[data-mode='resume'] .play { display: inline; }

  /* Pending input is derived from durable inbox events, never from a keypress. */
  .pending {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 0 18px;
    color: var(--label-caption);
    font-size: 12px;
  }

  .pending .chip { cursor: default; }

  .notice {
    align-self: center;
    color: var(--label-caption);
    font-size: 12px;
  }

  /* Slash menu: a filtered list of commands above the draft, like the TUI picker. */
  .slashMenu {
    margin: 0 10px;
    padding: 4px;
    border: 1px solid var(--border-l2);
    border-radius: 12px;
    background: var(--menu-fill);
    box-shadow: var(--shadow-lv2);
  }

  .slashMenu .pick { padding: 6px 8px; }
  .slashMenu .pick[data-active] { background: var(--sidebar-active); }
  .slashMenu .pickName { font-family: var(--font-code); font-size: 13px; }
  .slashMenu .pickPath { font-family: var(--font-ui); font-size: 12px; }

  #modelChip .chipName { font-family: var(--font-code); }

  .pick[data-selected] .pickName::after { content: ' ✓'; color: var(--accent); }

  .modalInput {
    width: 100%;
    margin: 4px 0 8px;
    padding: 8px 10px;
    border: 1px solid var(--border-l2);
    border-radius: 8px;
    background: var(--input-major);
    color: var(--label-primary);
    font: inherit;
    font-family: var(--font-code);
    outline: none;
  }

  .modalInput:focus { border-color: var(--accent); }
  .modalText { padding: 8px; color: var(--label-secondary); font-size: 13px; line-height: 20px; white-space: pre-wrap; }

  .status[data-state='pausing'] .clock, .status[data-state='aborting'] .clock { display: none; }

  /* ---- Picker ---------------------------------------------------------- */

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--overlay-mask);
  }

  #overlay[data-open] { display: flex; }

  .modal {
    display: flex;
    flex-direction: column;
    width: min(520px, calc(100vw - 32px));
    max-height: min(560px, calc(100vh - 64px));
    border: 1px solid var(--border-l2);
    border-radius: 16px;
    background: var(--menu-fill);
    box-shadow: var(--shadow-lv3);
    overflow: hidden;
  }

  .modalHead {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
    padding: 16px 16px 12px;
  }

  .modalTitle {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
  }

  .modalPath {
    flex: none;
    padding: 0 16px 10px;
    overflow: hidden;
    color: var(--label-caption);
    font-family: var(--font-code);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .modalList {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 8px 8px;
  }

  .pick {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 8px;
    border: none;
    border-radius: 8px;
    background: none;
    color: var(--label-primary);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .pick:hover { background: var(--interactive-hover); }

  .pickText {
    flex: 1;
    min-width: 0;
  }

  .pickName {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .pickPath {
    display: block;
    overflow: hidden;
    color: var(--label-caption);
    font-family: var(--font-code);
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .modalFoot {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
    padding: 12px 16px;
    border-top: 1px solid var(--border-l2);
  }

  .modalNote {
    flex: 1;
    color: var(--label-caption);
    font-size: 12px;
  }

  .button {
    padding: 7px 14px;
    border: 1px solid var(--border-l2);
    border-radius: 100px;
    background: none;
    color: var(--label-primary);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  .button:hover { background: var(--interactive-hover); }

  .button[data-primary] {
    border-color: transparent;
    background: var(--accent);
    color: rgb(255, 255, 255);
  }

  .button[data-primary]:hover { background: var(--accent-dim); }

  @media (max-width: 700px) {
    #rail {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 15;
      width: min(84vw, 320px);
      box-shadow: var(--shadow-lv3);
      transform: translateX(-102%);
      transition: transform 160ms ease;
    }

    #rail[data-mobile-open] { transform: translateX(0); }

    .railBackdrop {
      position: fixed;
      inset: 0 0 0 min(84vw, 320px);
      z-index: 14;
      display: block;
      border: 0;
      background: var(--overlay-mask);
    }

    .iconBtn.mobileMenu { display: inline-flex; }
    header { padding: 0 12px; }
    #flow { padding-inline: 16px; }
    #seat { padding-inline: 8px; }
    .hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    #rail { transition: none; }
    .status { background: none; color: var(--label-tertiary); animation: none; }
    .dot[data-state='running'] { animation: none; }
  }
