<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ava</title>

<style>
  /* Token layer. A subset of dsh's design-platform aliases: only the roles this
     surface actually paints, resolved to the same values so the two products
     read as one family. Light is the bare :root; dark redefines roles only. */
  :root {
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
      'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-code: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas,
      'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';

    --bg-base: rgb(255, 255, 255);
    --bg-layer-2: rgb(241, 243, 245);
    --sidebar-fill: rgb(249, 250, 251);
    --sidebar-hover: rgb(241, 243, 245);
    --sidebar-active: rgb(235, 238, 242);

    --label-primary: rgb(27, 27, 28);
    --label-secondary: rgb(97, 102, 107);
    --label-tertiary: rgb(129, 133, 140);
    --label-caption: rgb(151, 157, 166);

    --border-l1: rgba(0, 0, 0, 0.06);
    --border-l2: rgba(0, 0, 0, 0.1);
    --border-l3: rgba(0, 0, 0, 0.16);

    --bubble: rgb(237, 243, 254);
    --input-major: rgb(255, 255, 255);
    --code-block: rgb(245, 246, 247);
    --inline-code: rgb(241, 243, 245);
    --interactive-hover: rgba(0, 0, 0, 0.05);
    --overlay-mask: rgba(0, 0, 0, 0.2);
    --menu-fill: rgb(255, 255, 255);

    --accent: rgb(65, 118, 230);
    --accent-dim: rgb(103, 158, 254);
    --error: rgb(236, 19, 19);
    --success: rgb(34, 197, 94);
    --warn: rgb(245, 158, 11);

    --shadow-lv2: 0 4px 16px rgba(0, 0, 0, 0.08);
    --shadow-lv3: 0 12px 40px rgba(0, 0, 0, 0.16);

    /* One shared width axis, as in dsh's ConversationRoot: the transcript is W,
       the composer card is W + 32, so both stay centered on the same line. */
    --chat-width: 748px;
    --composer-width: calc(var(--chat-width) + 32px);
    --composer-clearance: 16px;
  }

  :root:not([data-theme='light']) {
    @media (prefers-color-scheme: dark) {
      --bg-base: rgb(21, 21, 23);
      --bg-layer-2: rgb(44, 44, 46);
      --sidebar-fill: rgb(27, 27, 28);
      --sidebar-hover: rgb(35, 35, 36);
      --sidebar-active: rgb(67, 69, 74);

      --label-primary: rgb(249, 250, 251);
      --label-secondary: rgb(207, 211, 214);
      --label-tertiary: rgb(173, 178, 184);
      --label-caption: rgb(129, 133, 140);

      --border-l1: rgba(255, 255, 255, 0.06);
      --border-l2: rgba(255, 255, 255, 0.12);
      --border-l3: rgba(255, 255, 255, 0.16);

      --bubble: rgb(44, 44, 46);
      --input-major: rgb(44, 44, 46);
      --code-block: rgb(27, 27, 28);
      --inline-code: rgb(44, 44, 46);
      --interactive-hover: rgba(255, 255, 255, 0.08);
      --overlay-mask: rgba(0, 0, 0, 0.5);
      --menu-fill: rgb(53, 54, 56);

      --accent: rgb(103, 158, 254);
      --accent-dim: rgb(86, 134, 254);
      --error: rgb(242, 90, 90);

      --shadow-lv2: 0 4px 16px rgba(0, 0, 0, 0.32);
      --shadow-lv3: 0 12px 40px rgba(0, 0, 0, 0.48);
    }
  }

  :root[data-theme='dark'] {
    --bg-base: rgb(21, 21, 23);
    --bg-layer-2: rgb(44, 44, 46);
    --sidebar-fill: rgb(27, 27, 28);
    --sidebar-hover: rgb(35, 35, 36);
    --sidebar-active: rgb(67, 69, 74);

    --label-primary: rgb(249, 250, 251);
    --label-secondary: rgb(207, 211, 214);
    --label-tertiary: rgb(173, 178, 184);
    --label-caption: rgb(129, 133, 140);

    --border-l1: rgba(255, 255, 255, 0.06);
    --border-l2: rgba(255, 255, 255, 0.12);
    --border-l3: rgba(255, 255, 255, 0.16);

    --bubble: rgb(44, 44, 46);
    --input-major: rgb(44, 44, 46);
    --code-block: rgb(27, 27, 28);
    --inline-code: rgb(44, 44, 46);
    --interactive-hover: rgba(255, 255, 255, 0.08);
    --overlay-mask: rgba(0, 0, 0, 0.5);
    --menu-fill: rgb(53, 54, 56);

    --accent: rgb(103, 158, 254);
    --accent-dim: rgb(86, 134, 254);
    --error: rgb(242, 90, 90);

    --shadow-lv2: 0 4px 16px rgba(0, 0, 0, 0.32);
    --shadow-lv3: 0 12px 40px rgba(0, 0, 0, 0.48);
  }

  * { box-sizing: border-box; }

  /* A class that sets `display` outranks the UA's `[hidden]` rule, so every
     `.iconBtn[hidden]` would still paint without this. */
  [hidden] { display: none !important; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb {
    border: 2px solid transparent;
    border-radius: 6px;
    background-clip: padding-box;
    background-color: var(--border-l3);
  }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--label-caption); }
  ::-webkit-scrollbar-track { background: transparent; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    background: var(--bg-base);
    color: var(--label-primary);
    font-family: var(--font-ui);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Rail ------------------------------------------------------------ */

  #rail {
    display: flex;
    flex: none;
    flex-direction: column;
    width: 252px;
    background: var(--sidebar-fill);
    border-right: 1px solid var(--border-l1);
  }

  .railHead {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 52px;
    padding: 0 12px 0 16px;
  }

  .wordmark {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .railList {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 8px 12px;
  }

  .railGroup {
    padding: 14px 8px 4px;
    color: var(--label-caption);
    font-size: 12px;
    font-weight: 500;
  }

  /* One row shape for every rail entry - new chat, project, chat. */
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 8px;
    border: none;
    border-radius: 8px;
    background: none;
    color: var(--label-secondary);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .row:hover { background: var(--sidebar-hover); }

  .row[data-selected] {
    background: var(--sidebar-active);
    color: var(--label-primary);
  }

  .rowName {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .newChat {
    margin-top: 4px;
    color: var(--label-primary);
    font-weight: 500;
  }

  .glyphSlot {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    color: var(--label-tertiary);
  }

  .project { color: var(--label-primary); }

  .projectChevron {
    transition: transform 120ms ease;
  }

  .project[data-open] .projectChevron { transform: rotate(90deg); }

  .chats { display: none; }
  .projectBlock[data-open] .chats { display: block; }

  .chatGroup { display: flex; align-items: center; border-radius: 8px; }

  .chatGroup:hover { background: var(--sidebar-hover); }
  .chatGroup[data-selected] { background: var(--sidebar-active); }
  .chatGroup[data-selected] .chat { color: var(--label-primary); }

  .chat {
    flex: 1; min-width: 0; width: auto;
    padding-left: 32px;
    background: none;
    font-size: 13px;
  }

  .chatGroup .chat:hover { background: none; }
  .archiveChat { opacity: 0; }

  .chatGroup:hover .archiveChat, .archiveChat:focus-visible { opacity: 1; }
  .archiveChat:hover { background: var(--interactive-hover); color: var(--label-primary); }

  .archivedToggle { padding-left: 32px; color: var(--label-caption); font-size: 12px; }

  .archivedToggle .projectChevron { margin-left: auto; }
  .archivedGroup[data-open] .projectChevron { transform: rotate(90deg); }
  .archivedList { display: none; }
  .archivedGroup[data-open] .archivedList { display: block; }

  /* Run-state dot, shared by the rail and the header. */
  .dot {
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: transparent;
  }

  .dot[data-state='running'] {
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }

  .dot[data-state='error'] { background: var(--error); }
  .dot[data-state='idle'] { background: var(--label-caption); }

  @keyframes pulse {
    50% { opacity: 0.35; }
  }

  /* ---- Column ---------------------------------------------------------- */

  main {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-width: 0;
  }

  header {
    display: flex;
    flex: none;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border-l2);
  }

  #title {
    font-size: 14px;
    font-weight: 500;
  }

  #cwd {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    color: var(--label-caption);
    font-family: var(--font-code);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .iconBtn {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    border-radius: 8px;
    background: none;
    color: var(--label-tertiary);
    cursor: pointer;
  }

  .iconBtn:hover {
    background: var(--interactive-hover);
    color: var(--label-primary);
  }

  /* The column scrolls on one axis and holds the sticky composer, so wheeling
     over the footer still moves the transcript (dsh's scrollBody). */
  #scroll {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-gutter: stable;
  }

  #flow {
    flex: 1 0 auto;
    padding: 16px calc(var(--composer-clearance) + 16px);
  }

  #column {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: var(--chat-width);
    margin: 0 auto;
  }

  /* ---- Rows ------------------------------------------------------------ */

  .userRow {
    display: flex;
    justify-content: flex-end;
  }

  .bubble {
    max-width: min(525px, 82%);
    padding: 10px 16px;
    border-radius: 22px;
    background: var(--bubble);
    font-size: 16px;
    line-height: 24px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .assistant {
    font-size: 16px;
    line-height: 26px;
    overflow-wrap: anywhere;
  }

  .assistant p { margin: 0 0 12px; }
  .assistant p:last-child { margin-bottom: 0; }

  .assistant code {
    padding: 1px 4px;
    border-radius: 5px;
    background: var(--inline-code);
    font-family: var(--font-code);
    font-size: 0.88em;
  }

  .assistant pre {
    margin: 12px 0;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--code-block);
    overflow-x: auto;
  }

  .assistant pre code {
    padding: 0;
    border-radius: 0;
    background: none;
    font-size: 13px;
    line-height: 22px;
  }

  .assistant table {
    margin: 12px 0;
    border-collapse: collapse;
    font-size: 0.95em;
    display: block;
    max-width: 100%;
    overflow-x: auto;
  }

  .assistant th,
  .assistant td {
    padding: 5px 12px;
    border: 1px solid var(--border-l2);
    text-align: left;
  }

  .assistant th {
    background: var(--inline-code);
    font-weight: 600;
  }

  /* Tool row: dsh's DisclosureRow - 24px row, 16px leading, gap 6, 14/24 title.
     The chevron swaps in for the glyph on hover, as it does there. */
  .tool { min-width: 0; }

  .toolRow {
    display: flex;
    align-items: center;
    width: 100%;
    height: 24px;
    min-width: 0;
    padding: 0;
    border: none;
    border-radius: 6px;
    background: none;
    color: var(--label-secondary);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .toolRow:hover { background: var(--interactive-hover); }

  .leading {
    position: relative;
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    margin-right: 6px;
    color: var(--label-tertiary);
  }

  .leading svg { position: absolute; transition: opacity 100ms ease; }
  .leading .chev { opacity: 0; }
  .toolRow:hover .glyph { opacity: 0; }
  .toolRow:hover .chev { opacity: 1; }
  .tool[data-open] .chev { transform: rotate(90deg); }

  .toolName {
    flex: none;
    font-size: 14px;
    line-height: 24px;
  }

  .toolArg {
    flex: 1;
    min-width: 0;
    margin-left: 8px;
    overflow: hidden;
    color: var(--label-caption);
    font-family: var(--font-code);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .toolDuration {
    flex: none;
    margin-left: 8px;
    color: var(--label-caption);
    font-family: var(--font-code);
    font-size: 12px;
  }

  .toolDuration:empty { margin-left: 0; }

  .toolBody { display: none; }
  .tool[data-open] .toolBody { display: block; }

  /* Terminal card: dsh's TerminalBlock geometry - 12px radius, code-block
     surface, and `white-space: pre` because folding column-aligned output
     destroys its alignment. */
  .term {
    margin: 8px 0 4px 22px;
    border-radius: 12px;
    background: var(--code-block);
    overflow: hidden;
  }

  .termHead {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border-l2);
    color: var(--label-secondary);
    font-family: var(--font-code);
    font-size: 12px;
    line-height: 20px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .termOut {
    max-height: 360px;
    margin: 0;
    padding: 10px 14px;
    overflow: auto;
    color: var(--label-secondary);
    font-family: var(--font-code);
    font-size: 12px;
    line-height: 20px;
    white-space: pre;
  }

  .term[data-error] .termOut { color: var(--error); }

  /* Working line: dsh's shimmer sweep across the label. */
  .status {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    height: 26px;
    font-size: 14px;
    font-weight: 500;
    background: linear-gradient(
      90deg,
      var(--label-tertiary) 0%,
      var(--label-tertiary) 40%,
      var(--label-primary) 50%,
      var(--label-tertiary) 60%,
      var(--label-tertiary) 100%
    );
    background-size: 250% 100%;
    background-position: 100% 0;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    animation: shimmer 1.8s linear infinite;
  }

  @keyframes shimmer {
    to { background-position: 0 0; }
  }

  .clock {
    margin-left: 8px;
    color: var(--label-caption);
    -webkit-text-fill-color: var(--label-caption);
    font-size: 13px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
  }

  .errorRow {
    display: flex;
    gap: 8px;
    align-items: start;
    font-size: 13px;
    line-height: 20px;
  }

  .errorRow .dot {
    margin-top: 7px;
    background: var(--error);
  }

  .errorTitle {
    margin-right: 6px;
    color: var(--error);
    font-weight: 600;
  }

  .errorText { color: var(--label-secondary); }

  /* Empty state: the hero the composer sits under before a chat has content. */
  .empty {
    margin: 120px auto 0;
    color: var(--label-caption);
    font-size: 14px;
    text-align: center;
  }

  .emptyTitle {
    margin-bottom: 6px;
    color: var(--label-primary);
    font-size: 20px;
    font-weight: 500;
  }

  /* ---- Composer -------------------------------------------------------- */

  /* Sticky inside the scroller, with dsh's fixed 36px fade band: a growing
     draft widens the solid region instead of stretching the fade. */
  #seat {
    position: sticky;
    bottom: 0;
    z-index: 7;
    display: flex;
    flex: none;
    flex-direction: column;
    align-items: center;
    padding: 0 var(--composer-clearance) 8px;
    background: linear-gradient(
      180deg,
      color-mix(in srgb, var(--bg-base) 0%, transparent) 0px,
      var(--bg-base) 36px
    );
  }

  #card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: var(--composer-width);
    padding-top: 10px;
    border: 1px solid var(--border-l2);
    border-radius: 22px;
    background: var(--input-major);
    box-shadow: var(--shadow-lv2);
  }

  #card[data-drag] {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), var(--shadow-lv2);
  }

  .attachments {
    display: flex; gap: 8px; min-width: 0; overflow-x: auto;
  }

  #attachmentTray { padding: 0 18px; }

  .attachmentChip {
    flex: none; max-width: 240px; padding: 4px 6px;
    color: var(--label-tertiary); cursor: default;
  }

  .attachmentChip:hover { color: var(--label-tertiary); }

  .attachmentChip img, .attachmentGlyph {
    flex: none; width: 28px; height: 28px; border-radius: 6px;
  }

  .attachmentChip img { object-fit: cover; }

  .attachmentGlyph {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--border-l1);
  }

  .attachmentCopy { min-width: 0; }

  .attachmentName {
    display: block; overflow: hidden; color: var(--label-secondary);
    text-overflow: ellipsis; white-space: nowrap;
  }

  .attachmentDetail { display: block; color: var(--label-caption); font-size: 11px; }

  .attachmentRemove { width: 22px; height: 22px; margin-left: 2px; font-size: 12px; }

  #attach:disabled { opacity: 0.4; cursor: default; }

  .bubble .attachments { flex-wrap: wrap; margin-top: 8px; overflow: visible; }
  .bubble > .attachments:first-child { margin-top: 0; }

  #draft {
    max-height: 336px;
    padding: 0 18px;
    border: none;
    background: none;
    color: var(--label-primary);
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 24px;
    resize: none;
    outline: none;
    overflow-y: auto;
  }

  #draft::placeholder { color: var(--label-caption); }
  #draft:disabled { color: var(--label-tertiary); cursor: not-allowed; }

  .archiveNotice {
    display: flex; align-items: center; gap: 12px;
    padding: 0 10px 0 18px;
    color: var(--label-secondary);
    font-size: 13px;
  }

  .archiveNotice span { flex: 1; }
  .archiveNotice .button { padding: 4px 10px; }

  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px 10px;
  }

  /* Workspace chip: the composer states which directory the turn will run in,
     because that is the one piece of context a coding agent acts on. */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 320px;
    padding: 4px 10px;
    border: none;
    border-radius: 100px;
    background: var(--interactive-hover);
    color: var(--label-tertiary);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }

  .chip:hover { color: var(--label-primary); }

  .chipName {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .hint {
    flex: 1;
    color: var(--label-caption);
    font-size: 12px;
    text-align: right;
  }

  .hint[data-running] { color: var(--label-tertiary); }

  .send {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: rgb(255, 255, 255);
    cursor: pointer;
  }

  .send:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .send[data-stop] { background: var(--label-secondary); }
  .send .square { display: none; }
  .send[data-stop] .arrow { display: none; }
  .send[data-stop] .square { display: inline; }

  /* ---- Picker ---------------------------------------------------------- */

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--overlay-mask);
  }

  #overlay[data-open] { display: flex; }

  .modal {
    display: flex;
    flex-direction: column;
    width: min(520px, calc(100vw - 32px));
    max-height: min(560px, calc(100vh - 64px));
    border: 1px solid var(--border-l2);
    border-radius: 16px;
    background: var(--menu-fill);
    box-shadow: var(--shadow-lv3);
    overflow: hidden;
  }

  .modalHead {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
    padding: 16px 16px 12px;
  }

  .modalTitle {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
  }

  .modalPath {
    flex: none;
    padding: 0 16px 10px;
    overflow: hidden;
    color: var(--label-caption);
    font-family: var(--font-code);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .modalList {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 8px 8px;
  }

  .pick {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 8px;
    border: none;
    border-radius: 8px;
    background: none;
    color: var(--label-primary);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .pick:hover { background: var(--interactive-hover); }

  .pickText {

<script>
  'use strict'

  // ---- REST client -------------------------------------------------------
  // Same-origin only: the server binds loopback and fences on Host, so there is
  // no base URL to configure and nothing to authenticate against.

  const api = {
    projects: () => call('GET', '/api/projects').then(payload => payload.projects),
    addProject: path => call('POST', '/api/projects', { path }),
    browse: path => call('GET', `/api/fs?path=${encodeURIComponent(path || '')}`),
    createChat: project => call('POST', '/api/chats', { project_id: project }),
    open: id => call('GET', `/api/chats/${id}`),
    message: (id, text, attachments, delivery) =>
      call('POST', `/api/chats/${id}/messages`, { text, attachments, delivery }),
    archive: (id, archived) => call('POST', `/api/chats/${id}/archive`, { archived }),
  }

  async function call(method, path, body) {
    const response = await fetch(path, {
      method,
      headers: body === undefined ? {} : { 'content-type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
    })
    if (!response.ok) {
      const detail = await response.json().then(payload => payload.error).catch(() => '')
      throw new Error(detail || `${method} ${path} → ${response.status}`)
    }
    return response.status === 204 ? null : response.json()
  }

  // ---- State -------------------------------------------------------------

  const state = {
    projects: [],     // [{ id, name, path, chats: [{ id, title, status, archived }] }]
    current: null,    // chat id
    project: null,    // project id owning the current chat
    open: new Set(),  // expanded project ids
    archiveOpen: new Set(),
    stream: null,
    selection: 0,
    status: 'idle',
    submitting: false,
    startedAt: 0,
    tail: null,       // live assistant block: { node, raw, pending }
    calls: new Map(), // call_id → tool row element
    displayedInputs: new Set(),
  }

  const $ = id => document.getElementById(id)
  const column = $('column')

  const projectOf = id => state.projects.find(project => project.id === id)
  const chatOf = id =>
    state.projects.flatMap(project => project.chats).find(chat => chat.id === id)

  // ---- Rendering ---------------------------------------------------------

  const escapeHtml = text =>
    text.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

  // A block is a table when every line is piped and the second line is the
  // GFM separator row. Cells arrive already escaped and inline-rendered.
  const separatorRow = /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?$/

  const splitRow = line => {
    const cells = line.split('|')
    if (cells.length && cells[0].trim() === '') cells.shift()
    if (cells.length && cells[cells.length - 1].trim() === '') cells.pop()
    return cells.map(cell => cell.trim())
  }

  const cellAlign = separator =>
    separator.endsWith(':') ? (separator.startsWith(':') ? ' style="text-align:center"' : ' style="text-align:right"') : ''

  function renderTable(lines) {
    const aligns = splitRow(lines[1]).map(cellAlign)
    const row = (cells, tag) =>
      `<tr>${cells.map((cell, i) => `<${tag}${aligns[i] || ''}>${cell}</${tag}>`).join('')}</tr>`
    const head = row(splitRow(lines[0]), 'th')
    const body = lines.slice(2).map(line => row(splitRow(line), 'td')).join('')
    return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`
  }

  const isTable = lines =>
    lines.length >= 2 && lines.every(line => line.includes('|')) &&
    separatorRow.test(lines[1].trim()) && splitRow(lines[0]).length >= 2

  // Closed KaTeX delimiters only: an unclosed pair stays raw text while the
  // answer is still streaming. Single-dollar is deliberately not a delimiter,
  // because prose about costs false-positives (D-37).
  function mathHtml(raw, tex, display) {
    if (!window.katex) return escapeHtml(raw)
    return katex.renderToString(tex, { displayMode: display, throwOnError: false })
  }

  // Deliberately small: fenced blocks, inline code, bold, tables, math, and
  // paragraphs. Full markdown is the point at which this file should stop
  // being one file.
  function renderMarkdown(source) {
    return source
      .split(/```/)
      .map((part, index) => {
        if (index % 2 === 1) {
          const newline = part.indexOf('\n')
          const body = newline === -1 ? part : part.slice(newline + 1)
          return `<pre><code>${escapeHtml(body.replace(/\n$/, ''))}</code></pre>`
        }
        // Code spans and math are lifted out before escaping: code first, so a
        // delimiter quoted in backticks is never rendered as math. The stash
        // survives escaping, bold, and table cells untouched.
        const stash = []
        const hold = html => `\u0000${stash.push(html) - 1}\u0000`
        const guarded = part
          .replace(/`([^`\n]+)`/g, (_, code) => hold(`<code>${escapeHtml(code)}</code>`))
          .replace(/\$\$([^$]+?)\$\$/g, (raw, tex) => hold(mathHtml(raw, tex, true)))
          .replace(/\\\[([\s\S]+?)\\\]/g, (raw, tex) => hold(mathHtml(raw, tex, true)))
          .replace(/\\\(([\s\S]+?)\\\)/g, (raw, tex) => hold(mathHtml(raw, tex, false)))
        return escapeHtml(guarded)
          .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
          .split(/\n{2,}/)
          .filter(block => block.trim() !== '')
          .map(block => {
            const lines = block.split('\n').filter(line => line.trim() !== '')
            if (isTable(lines)) return renderTable(lines)
            return `<p>${block.replace(/\n/g, '<br>')}</p>`
          })
          .join('')
          .replace(/\u0000(\d+)\u0000/g, (_, held) => stash[held])
      })
      .join('')
  }

  const icons = {
    chev: '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5l3.5 3.5-3.5 3.5"/></svg>',
    bash: '<svg class="glyph" width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4l2.5 2.5L3 9M7.5 10h3.5"/></svg>',
    file: '<svg class="glyph" width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5H4a1 1 0 00-1 1v9a1 1 0 001 1h6a1 1 0 001-1V4.5L8 1.5z"/><path d="M8 1.5v3h3"/></svg>',
    folder: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 12.5v-9h4.3l1.4 1.8h6.7v7.2a.8.8 0 01-.8.8H2.6a.8.8 0 01-.8-.8z"/></svg>',
    image: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><circle cx="5.5" cy="6" r="1.2"/><path d="M3.5 11l3-3 2.2 2.2 1.4-1.4 2.4 2.2"/></svg>',
    up: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5v-9M4 7.5L8 3.5l4 4"/></svg>',
    caret: '<svg class="projectChevron" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5l3.5 3.5-3.5 3.5"/></svg>',
    archive: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h11M3.5 4.5l.8 8h7.4l.8-8M6 7.5h4M2 2h12v2.5H2z"/></svg>',
  }

  const glyphFor = tool => (tool === 'bash' ? icons.bash : icons.file)

  function element(html) {
    const template = document.createElement('template')
    template.innerHTML = html.trim()
    return template.content.firstElementChild
  }

  function formatBytes(bytes) {
    const units = ['B', 'KiB', 'MiB']
    let value = bytes
    let unit = 0
    while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++ }
    return `${unit === 0 ? value : value.toFixed(value < 10 ? 1 : 0)} ${units[unit]}`
  }

  function attachmentChip(name, kind, size, preview = '') {
    const node = element(`<span class="chip attachmentChip">
      <span class="attachmentGlyph"></span>
      <span class="attachmentCopy"><span class="attachmentName"></span><span class="attachmentDetail"></span></span>
    </span>`)
    const glyph = node.querySelector('.attachmentGlyph')
    if (preview) {
      const image = document.createElement('img')
      image.src = preview
      image.alt = ''
      glyph.replaceWith(image)
    } else {
      glyph.innerHTML = kind === 'image' ? icons.image : icons.file
    }
    node.querySelector('.attachmentName').textContent = name
    node.querySelector('.attachmentDetail').textContent =
      `${kind === 'image' ? 'Image' : 'File'} · ${formatBytes(size)}`
    return node
  }

  // The working line is the transcript's tail while a turn runs, so rows
  // arriving during that turn go in above it rather than after it.
  function add(node) {
    if (statusRow && statusRow.parentNode === column) column.insertBefore(node, statusRow)
    else column.append(node)
    scrollToBottom()
    return node
  }

  function addUser(blocks) {
    closeTail()
    clearEmpty()
    const bubble = add(element(`<div class="userRow"><div class="bubble"></div></div>`))
      .firstElementChild
    const text = (blocks || []).filter(block => block.kind === 'text')
      .map(block => block.text).join('\n')
    if (text) bubble.append(document.createTextNode(text))
    const attachments = (blocks || []).filter(block =>
      block.kind === 'image' || block.kind === 'file_text')
    if (attachments.length) {
      const tray = element('<span class="attachments"></span>')
      for (const block of attachments) {
        tray.append(attachmentChip(block.display_path, block.kind, block.byte_size))
      }
      bubble.append(tray)
    }
    // Your own message always pulls the viewport down, even when you were
    // reading scrollback - the follow-only-if-near rule is for the model.
    const scroll = $('scroll')
    scroll.scrollTop = scroll.scrollHeight
  }

  function addError(message) {
    closeTail()
    const row = add(element(
      `<div class="errorRow"><span class="dot"></span><div><span class="errorTitle">Error</span><span class="errorText"></span></div></div>`
    ))
    row.querySelector('.errorText').textContent = message
  }

  // One live assistant block per run of text deltas. Re-rendering markdown per
  // delta is wasteful on a long answer, so the repaint is batched to a frame.
  function appendDelta(text) {
    if (!state.tail) {
      state.tail = { node: add(element('<div class="assistant"></div>')), raw: '', pending: false }
    }
    const tail = state.tail
    tail.raw += text
    if (!tail.pending) {
      tail.pending = true
      requestAnimationFrame(() => paint(tail))
    }
  }

  function paint(tail) {
    tail.pending = false
    tail.node.innerHTML = renderMarkdown(tail.raw)
    scrollToBottom()
  }

  // The batched repaint is captured per block, and a closing block flushes
  // synchronously: dropping the reference with a frame still pending is what
  // silently loses the last delta of every answer.
  function closeTail() {
    if (state.tail && state.tail.pending) paint(state.tail)
    state.tail = null
  }

  function addToolCall(event) {
    closeTail()
    const summary = summarize(event.tool, event.args)
    const node = add(element(`
      <div class="tool">
        <button class="toolRow">
          <span class="leading">${glyphFor(event.tool)}${icons.chev}</span>
          <span class="toolName"></span>
          <span class="toolArg"></span>
          <span class="toolDuration"></span>
        </button>
        <div class="toolBody"><div class="term"><div class="termHead"></div><pre class="termOut"></pre></div></div>
      </div>`))
    node.querySelector('.toolName').textContent = event.tool
    node.querySelector('.toolArg').textContent = summary
    node.querySelector('.termHead').textContent = summary || event.args
    node.querySelector('.termOut').textContent = '…'
    node.querySelector('.toolRow').addEventListener('click', () => node.toggleAttribute('data-open'))
    state.calls.set(event.call_id, node)
  }

  function addToolResult(event) {
    const node = state.calls.get(event.call_id)
    if (!node) return
    node.querySelector('.termOut').textContent = event.text || '(no output)'
    node.querySelector('.term').toggleAttribute('data-error', Boolean(event.is_error))
    if (Number.isFinite(event.elapsed_ms)) {
      const elapsed = event.elapsed_ms < 1000
        ? `${event.elapsed_ms}ms`
        : `${(Math.floor(event.elapsed_ms / 100) / 10).toFixed(1)}s`
      node.querySelector('.toolDuration').textContent = elapsed
    }
    if (event.is_error) node.setAttribute('data-open', '')
    scrollToBottom()
  }

  // The one-line preview beside a tool name: the command for bash, the path for
  // the file tools, and the raw arguments when a tool is neither.
  function summarize(tool, args) {
    try {
      const parsed = JSON.parse(args)
      return parsed.command || parsed.path || parsed.file_path || args
    } catch {
      return args
    }
  }

  let statusRow = null
  let clockTimer = 0

  function syncComposer() {
    const archived = Boolean(chatOf(state.current)?.archived)
    const unavailable = archived || state.submitting
    const running = state.status === 'running'
    $('draft').disabled = unavailable
    $('draft').placeholder = running ? 'Steer the current turn…' : 'Ask ava to do something…'
    $('attach').disabled = unavailable
    $('archiveNotice').hidden = !archived
    $('send').disabled = unavailable
    $('send').title = archived ? 'Archived'
      : state.submitting ? 'Sending'
      : running ? 'Steer current turn' : 'Send'
    $('send').setAttribute('aria-label', $('send').title)
    $('composerHint').textContent = state.submitting ? 'Sending…'
      : running ? 'Enter steers · Alt+Enter queues · Shift+Enter newline'
      : 'Enter to send · Shift+Enter for a newline'
    $('composerHint').toggleAttribute('data-running', running && !state.submitting)
  }

  function setStatus(status) {
    state.status = status
    $('headDot').dataset.state = status === 'running' ? 'running' : 'idle'
    syncComposer()
    renderRail()

    if (status === 'running' && !statusRow) {
      state.startedAt = Date.now()
      statusRow = element('<div class="status">Working<span class="clock">0s</span></div>')
      column.append(statusRow)
      scrollToBottom()
      clockTimer = setInterval(() => {
        const seconds = Math.floor((Date.now() - state.startedAt) / 1000)
        if (statusRow) statusRow.querySelector('.clock').textContent = `${seconds}s`
      }, 1000)
    } else if (status !== 'running' && statusRow) {
      clearInterval(clockTimer)
      statusRow.remove()
      statusRow = null
    }
  }

  function scrollToBottom() {
    const scroll = $('scroll')
    // Only follow the tail when the reader is already there; yanking the
    // viewport away from someone reading scrollback is the worst chat bug.
    const distance = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight
    if (distance < 120) scroll.scrollTop = scroll.scrollHeight
  }

  // ---- Events ------------------------------------------------------------

  function apply(event) {
    if (event.kind === 'step/claimed') {
      const messages = event.messages || []
      for (const message of messages) {
        if (!message.id || !state.displayedInputs.has(message.id)) addUser(message.blocks)
        if (message.id) state.displayedInputs.add(message.id)
      }
    } else if (event.kind === 'user/message') addUser(event.blocks)
    else if (event.kind === 'selection' && event.warning) addError(event.warning)
    else if (event.kind === 'turn/start') setStatus('running')
    else if (event.kind === 'assistant/chunk') appendDelta(event.delta)
    else if (event.kind === 'assistant/message') {
      const blocks = event.blocks || []
      const text = blocks.filter(block => block.kind === 'text')
        .map(block => block.text).join('')
      // Replace the live tail in place because the durable message owns the complete text.
      if (state.tail) {
        state.tail.raw = text
        paint(state.tail)
      } else if (text) appendDelta(text)
      const calls = blocks.filter(block => block.kind === 'tool_call')
      for (const block of calls) {
        addToolCall({ call_id: block.call_id, tool: block.tool_name, args: block.arguments_json })
      }
    } else if (event.kind === 'tool/result') {
      const durations = new Map((event.durations || []).map(item => [item.call_id, item.elapsed_ms]))
      for (const block of event.blocks || []) {
        if (block.kind === 'tool_result') {
          addToolResult({ ...block, elapsed_ms: durations.get(block.call_id) })
        }
      }
    } else if (event.kind === 'step/end') {
      closeTail()
    } else if (event.kind === 'turn/end') {
      closeTail()
      setStatus('idle')
    } else if (event.kind === 'compaction/failed') {
      addError(event.message)
    } else if (event.kind === 'drive/error') {
      addError(event.message)
      setStatus('idle')
    }
  }

  function openStream(id, selection) {
    if (state.stream) state.stream.close()
    // EventSource reconnects on its own and replays from Last-Event-ID, which
    // is why every event carries a seq.
    const stream = new EventSource(`/api/chats/${id}/events`)
    stream.onmessage = message => {
      if (state.current !== id || state.selection !== selection) return
      apply(JSON.parse(message.data))
    }
    state.stream = stream
  }

  // ---- Rail --------------------------------------------------------------

  function renderChat(host, chat) {
    const group = element(`<div class="chatGroup">
      <button class="row chat"><span class="dot"></span><span class="rowName"></span></button>
      <button class="iconBtn archiveChat" type="button">${icons.archive}</button>
    </div>`)
    const select = group.querySelector('.chat')
    const archive = group.querySelector('.archiveChat')
    select.querySelector('.rowName').textContent = chat.title || 'New chat'
    select.querySelector('.dot').dataset.state =
      chat.id === state.current && state.status === 'running' ? 'running' : ''
    if (chat.id === state.current) group.setAttribute('data-selected', '')
    select.addEventListener('click', () => selectChat(chat.id))
    archive.setAttribute('aria-label', chat.archived ? 'Unarchive chat' : 'Archive chat')
    archive.title = archive.getAttribute('aria-label')
    archive.addEventListener('click', () => setArchived(chat, !chat.archived))
    host.append(group)
  }

  async function setArchived(chat, archived) {
    try {
      const updated = await api.archive(chat.id, archived)
      Object.assign(chat, updated)
      if (state.current === chat.id) setStatus(updated.status)
      else renderRail()
    } catch (error) {
      if (state.current === chat.id) addError(String(error.message || error))
      else console.error(error)
    }
  }

  function renderRail() {
    const host = $('projects')
    host.textContent = ''
    for (const project of state.projects) {
      const block = element('<div class="projectBlock"></div>')
      if (state.open.has(project.id)) block.setAttribute('data-open', '')

      const head = element(`
        <button class="row project">
          <span class="glyphSlot">${icons.caret}</span>
          <span class="glyphSlot">${icons.folder}</span>
          <span class="rowName"></span>
        </button>`)
      head.querySelector('.rowName').textContent = project.name
      head.title = project.path
      if (state.open.has(project.id)) head.setAttribute('data-open', '')
      head.addEventListener('click', () => {
        if (state.open.has(project.id)) state.open.delete(project.id)
        else state.open.add(project.id)
        renderRail()
      })
      block.append(head)

      const chats = element('<div class="chats"></div>')
      for (const chat of project.chats.filter(chat => !chat.archived)) renderChat(chats, chat)
      const archived = project.chats.filter(chat => chat.archived)
      if (archived.length) {
        const section = element(`<div class="archivedGroup">
          <button class="row archivedToggle"><span class="rowName">Archived</span>${icons.caret}</button>
          <div class="archivedList"></div>
        </div>`)
        const expanded = state.archiveOpen.has(project.id)
        section.toggleAttribute('data-open', expanded)
        const toggle = section.querySelector('.archivedToggle')
        toggle.setAttribute('aria-expanded', String(expanded))
        toggle.addEventListener('click', () => {
          if (expanded) state.archiveOpen.delete(project.id)
          else state.archiveOpen.add(project.id)
          renderRail()
        })
        for (const chat of archived) renderChat(section.querySelector('.archivedList'), chat)
        chats.append(section)
      }
      block.append(chats)
      host.append(block)
    }
  }

  async function selectChat(id) {
    const selection = ++state.selection
    state.current = id
    if (state.stream) state.stream.close()
    state.stream = null
    state.calls.clear()
    state.displayedInputs.clear()
    closeTail()
    column.textContent = ''
    if (statusRow) { clearInterval(clockTimer); statusRow = null }

    const chat = await api.open(id)
    if (state.selection !== selection) return
    state.project = chat.project_id
    state.open.add(chat.project_id)
    const summary = chatOf(chat.id)
    if (summary) Object.assign(summary,
      { title: chat.title, status: chat.status, archived: chat.archived })

    const project = projectOf(chat.project_id)
    $('title').textContent = chat.title || 'New chat'
    $('cwd').textContent = chat.cwd || (project ? project.path : '')
    $('workspaceName').textContent = project ? project.name : 'No project'

    for (const event of chat.events || []) apply(event)
    if (!(chat.events || []).length) showEmpty(project)
    setStatus(chat.status === 'running' ? 'running' : 'idle')
    openStream(id, selection)
    if (!chat.archived) $('draft').focus()
  }

  function showEmpty(project) {
    const node = element(`<div class="empty"><div class="emptyTitle"></div><div class="emptySub"></div></div>`)
    node.querySelector('.emptyTitle').textContent = project ? project.name : 'New chat'
    node.querySelector('.emptySub').textContent = project
      ? `ava will work in ${project.path}`
      : 'Pick a project directory to start.'
    column.append(node)
  }

  const clearEmpty = () => column.querySelector('.empty')?.remove()

  // ---- Project picker ----------------------------------------------------

  let browsePath = null

  function openPicker() {
    browsePath = null
    $('overlay').setAttribute('data-open', '')
    renderPicker()
  }

  const closePicker = () => $('overlay').removeAttribute('data-open')

  function renderPicker() {
    const list = $('modalList')
    list.textContent = ''
    $('modalBack').hidden = browsePath === null
    $('modalPath').hidden = browsePath === null
    $('modalBrowse').hidden = browsePath !== null
    $('modalOpen').hidden = browsePath === null
    $('modalTitle').textContent = browsePath === null ? 'Start a new chat' : 'Choose a folder'
    $('modalNote').textContent = browsePath === null
      ? 'Chats are grouped by project directory.'
      : 'ava runs its tools inside the folder you choose.'

    if (browsePath === null) {
      if (state.projects.length === 0) {
        list.append(element('<div class="modalNote" style="padding:8px">No projects yet - browse for a folder to add one.</div>'))
      }
      for (const project of state.projects) {
        const row = element(`<button class="pick">${icons.folder}<span class="pickText"><div class="pickName"></div><div class="pickPath"></div></span></button>`)
        row.querySelector('.pickName').textContent = project.name
        row.querySelector('.pickPath').textContent = project.path
        row.addEventListener('click', () => startChat(project.id))
        list.append(row)
      }
      return
    }

    $('modalPath').textContent = browsePath.path
    if (browsePath.parent) {
      const up = element(`<button class="pick">${icons.up}<span class="pickText"><div class="pickName">..</div></span></button>`)
      up.addEventListener('click', () => browse(browsePath.parent))
      list.append(up)
    }
    for (const entry of browsePath.entries) {
      const row = element(`<button class="pick">${icons.folder}<span class="pickText"><div class="pickName"></div></span></button>`)
      row.querySelector('.pickName').textContent = entry.name
      row.addEventListener('click', () => browse(entry.path))
      list.append(row)
    }
    if (browsePath.entries.length === 0 && !browsePath.parent) {
      list.append(element('<div class="modalNote" style="padding:8px">Nothing to open here.</div>'))
    }
  }

  async function browse(path) {
    try {
      browsePath = await api.browse(path)
      renderPicker()
      $('modalList').scrollTop = 0
    } catch (error) {
      $('modalNote').textContent = String(error.message || error)
    }
  }

  async function startChat(projectId) {
    let created
    try {
      created = await api.createChat(projectId)
    } catch (error) {
      $('modalNote').textContent = String(error.message || error)
      return
    }
    const project = projectOf(projectId)
    if (project) project.chats.unshift(created)
    state.open.add(projectId)
    closePicker()
    await selectChat(created.id)
  }

  async function useFolder() {
    let project
    try {
      project = await api.addProject(browsePath.path)
    } catch (error) {
      $('modalNote').textContent = String(error.message || error)
      return
    }
    const existing = projectOf(project.id)
    if (existing) existing.chats = existing.chats || []
    else state.projects.unshift({ ...project, chats: project.chats || [] })
    await startChat(project.id)
  }

  $('newChat').addEventListener('click', openPicker)
  $('railNew').addEventListener('click', openPicker)
  $('workspace').addEventListener('click', openPicker)
  $('modalClose').addEventListener('click', closePicker)
  $('modalBack').addEventListener('click', () => { browsePath = null; renderPicker() })
  $('modalBrowse').addEventListener('click', () => browse(''))
  $('modalOpen').addEventListener('click', useFolder)
  $('overlay').addEventListener('click', event => {
    if (event.target === $('overlay')) closePicker()
  })
  addEventListener('keydown', event => {
    if (event.key === 'Escape') closePicker()
  })

  // ---- Composer ----------------------------------------------------------

  const draft = $('draft')
  const fileInput = $('fileInput')
  const staged = []
  let pastedSequence = 0

  function stageFiles(files) {
    if (draft.disabled) return false
    let added = false
    for (let file of files) {
      if (!file.name.trim()) {
        const rawSubtype = (file.type.split('/')[1] || 'bin').split(/[+;]/)[0]
        const subtype = rawSubtype.replace(/[^a-z0-9]/gi, '').toLowerCase() || 'bin'
        file = new File([file], `pasted-${++pastedSequence}.${subtype}`,
          { type: file.type, lastModified: file.lastModified })
      }
      staged.push({
        file,
        preview: file.type.startsWith('image/') ? URL.createObjectURL(file) : '',
      })
      added = true
    }
    if (added) renderStaged()
    return added
  }

  function renderStaged() {
    const tray = $('attachmentTray')
    tray.replaceChildren()
    for (const entry of staged) {
      const kind = entry.file.type.startsWith('image/') ? 'image' : 'file'
      const chip = attachmentChip(entry.file.name, kind, entry.file.size, entry.preview)
      const remove = element('<button class="iconBtn attachmentRemove" type="button">✕</button>')
      remove.setAttribute('aria-label', `Remove ${entry.file.name}`)
      remove.addEventListener('click', () => {
        if (entry.preview) URL.revokeObjectURL(entry.preview)
        staged.splice(staged.indexOf(entry), 1)
        renderStaged()
      })
      chip.append(remove)
      tray.append(chip)
    }
    tray.hidden = staged.length === 0
  }

  function clearStaged() {
    for (const entry of staged) if (entry.preview) URL.revokeObjectURL(entry.preview)
    staged.length = 0
    renderStaged()
  }

  function readBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader()
      reader.onload = () => resolve(String(reader.result).replace(/^data:[^,]*,/, ''))
      reader.onerror = () => reject(new Error(`Could not read ${file.name}`))
      reader.readAsDataURL(file)
    })
  }

  function autoGrow() {
    draft.style.height = 'auto'
    draft.style.height = `${Math.min(draft.scrollHeight, 336)}px`
  }

  const deliveryFor = altKey => altKey ? 'followup' : 'steer'

  async function submit(delivery) {
    if (state.submitting || chatOf(state.current)?.archived) return
    const text = draft.value.trim()
    if (text === '' && staged.length === 0) return
    if (!state.current) { openPicker(); return }

    clearEmpty()
    state.submitting = true
    syncComposer()
    try {
      const chatId = state.current
      const attachments = await Promise.all(staged.map(async entry => ({
        kind: entry.file.type.startsWith('image/') ? 'image' : 'file',
        name: entry.file.name,
        data_base64: await readBase64(entry.file),
      })))
      const accepted = await api.message(chatId, text, attachments, delivery)
      clearStaged()
      draft.value = ''
      autoGrow()
      const chat = chatOf(accepted.chat.id)
      if (chat) Object.assign(chat, accepted.chat)
      if (state.current === accepted.chat.id) {
        $('title').textContent = accepted.chat.title
        setStatus(accepted.chat.status)
      }
      renderRail()
    } catch (error) {
      addError(String(error.message || error))
    } finally {
      state.submitting = false
      syncComposer()
    }
  }

  $('attach').addEventListener('click', () => fileInput.click())
  fileInput.addEventListener('change', () => {
    stageFiles(fileInput.files)
    fileInput.value = ''
  })
  draft.addEventListener('paste', event => {
    if (stageFiles(event.clipboardData?.files || [])) event.preventDefault()
  })

  const card = $('card')
  const showDropTarget = event => {
    event.preventDefault()
    if (!draft.disabled) card.setAttribute('data-drag', '')
  }
  card.addEventListener('dragenter', showDropTarget)
  card.addEventListener('dragover', showDropTarget)
  card.addEventListener('dragleave', event => {
    if (!card.contains(event.relatedTarget)) card.removeAttribute('data-drag')
  })
  card.addEventListener('drop', event => {
    event.preventDefault()
    card.removeAttribute('data-drag')
    stageFiles(event.dataTransfer?.files || [])
  })
  addEventListener('dragover', event => event.preventDefault())
  addEventListener('drop', event => {
    event.preventDefault()
    card.removeAttribute('data-drag')
  })
  draft.addEventListener('input', autoGrow)
  draft.addEventListener('keydown', keyEvent => {
    if (keyEvent.key === 'Enter' && !keyEvent.shiftKey) {
      keyEvent.preventDefault()
      submit(deliveryFor(keyEvent.altKey))
    }
  })
  $('send').addEventListener('click', () => submit(deliveryFor(false)))
  $('unarchive').addEventListener('click', () => {
    const chat = chatOf(state.current)
    if (chat) setArchived(chat, false)
  })

  const stored = localStorage.getItem('ava-theme')
  if (stored) document.documentElement.dataset.theme = stored

  $('theme').addEventListener('click', () => {
    const dark = matchMedia('(prefers-color-scheme: dark)').matches
    const current = document.documentElement.dataset.theme || (dark ? 'dark' : 'light')
    const next = current === 'dark' ? 'light' : 'dark'
    document.documentElement.dataset.theme = next
    localStorage.setItem('ava-theme', next)
  })

  // ---- Boot --------------------------------------------------------------

  ;(async () => {
    try {
      state.projects = await api.projects()
    } catch {
      state.projects = []
    }
    const first = state.projects.flatMap(project => project.chats)[0]
    if (first) await selectChat(first.id)
    else {
      renderRail()
      showEmpty(null)
      openPicker()
    }
    draft.focus()
  })()
</script>
