[project]
name = "ava"
version = "0.1.0"
description = "A durable, replayable coding-agent harness for Python."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["agent", "anthropic", "coding-agent", "llm", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.10",
    "zstandard>=0.22",
]

[project.urls]
Homepage = "https://github.com/SmartAI/ava-python"
Repository = "https://github.com/SmartAI/ava-python.git"
Issues = "https://github.com/SmartAI/ava-python/issues"
Documentation = "https://github.com/SmartAI/ava-python/tree/main/docs"

[project.scripts]
ava = "ava.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ava"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
